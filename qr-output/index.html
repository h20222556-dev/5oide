<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <title>오이데 QR 카드 인쇄 시트</title>
  <style>
    @page {
      size: A4 portrait;
      margin: 12mm;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      background: #F6F4F7;
      color: #1F1A22;
      padding: 20px;
    }
    .toolbar {
      max-width: 186mm;
      margin: 0 auto 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: #FFFDFB;
      border: 1.5px solid #F4A9C4;
      border-radius: 12px;
    }
    .toolbar h1 { font-size: 16px; color: #70435F; }
    .toolbar p { font-size: 12.5px; color: #6B6178; margin-top: 2px; }
    .print-btn {
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      background: #F4A9C4;
      color: #4A253D;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .sheet {
      max-width: 186mm;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8mm;
    }
    .qr-card {
      background: #FFFFFF;
      border: 1px dashed #B8A9B4;
      border-radius: 10px;
      padding: 7mm 6mm 6mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .qr-img-wrap {
      width: 52mm;
      height: 52mm;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
    }
    .qr-img-wrap img {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      display: block;
    }
    .qr-code-num {
      margin-top: 4mm;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 22pt;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #111111;
    }
    .qr-card-title {
      margin-top: 2mm;
      font-size: 10pt;
      color: #5A4A56;
      word-break: keep-all;
    }
    @media print {
      body { background: #FFFFFF; padding: 0; }
      .toolbar { display: none !important; }
      .sheet { max-width: none; gap: 6mm; }
    }
  </style>
</head>
