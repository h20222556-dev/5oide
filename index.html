<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>오이데 (춘천에서 5명의 이상한 데이트)</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- ══════════════════════════════════════
       1. 타이틀 화면
  ══════════════════════════════════════ -->
  <div id="screen-title" class="screen">
    <div id="title-bg"></div>
    <div id="title-content">
      <div class="title-left-column">
        <div class="title-logo-slot" aria-hidden="true"></div>
        <nav id="title-menu" aria-label="타이틀 메뉴">
        <button type="button" class="title-btn title-img-btn" id="btn-new-game" data-menu-key="start" data-ready-label="새로 시작" aria-label="새로 시작" disabled aria-disabled="true">
          <img class="title-btn-img" src="assets/ui/ui_menu_start.png" srcset="assets/ui/ui_menu_start.png 1x, assets/ui/ui_menu_start@2x.png 2x" width="429" height="160" alt="" draggable="false">
          <span class="visually-hidden">새로 시작</span>
          <span class="title-btn-fallback" aria-hidden="true">불러오는 중…</span>
        </button>
        <button type="button" class="title-btn title-img-btn" id="btn-title-load" data-menu-key="load" aria-label="불러오기" disabled aria-disabled="true">
          <img class="title-btn-img" src="assets/ui/ui_menu_load.png" srcset="assets/ui/ui_menu_load.png 1x, assets/ui/ui_menu_load@2x.png 2x" width="429" height="160" alt="" draggable="false">
          <span class="visually-hidden">불러오기</span>
          <span class="title-btn-fallback" aria-hidden="true">불러오기</span>
        </button>
        <button type="button" class="title-btn title-img-btn" id="btn-title-gallery" data-menu-key="records" aria-label="기록실">
          <img class="title-btn-img" src="assets/ui/ui_menu_records.png" srcset="assets/ui/ui_menu_records.png 1x, assets/ui/ui_menu_records@2x.png 2x" width="429" height="160" alt="" draggable="false">
          <span class="visually-hidden">기록실</span>
          <span class="title-btn-fallback" aria-hidden="true">기록실</span>
        </button>
        <button type="button" class="title-btn title-img-btn" id="btn-title-settings" data-menu-key="settings" aria-label="설정">
          <img class="title-btn-img" src="assets/ui/ui_menu_settings.png" srcset="assets/ui/ui_menu_settings.png 1x, assets/ui/ui_menu_settings@2x.png 2x" width="429" height="160" alt="" draggable="false">
          <span class="visually-hidden">설정</span>
          <span class="title-btn-fallback" aria-hidden="true">설정</span>
        </button>
      </nav>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════
       2. 게임 화면
  ══════════════════════════════════════ -->
  <div id="screen-game" class="screen">
    <div id="game-wrapper">

      <!-- 배경 이미지 레이어 -->
      <div id="game-background">
        <span id="bg-placeholder-text">배경 없음</span>
      </div>

      <!-- 캐릭터 입화 레이어 (홍조 오버레이 지원) -->
      <div id="characters-layer">
        <div class="char-slot left" id="char-slot-left"></div>
        <div class="char-slot center" id="char-slot-center"></div>
        <div class="char-slot right" id="char-slot-right"></div>
      </div>

      <!-- 자막 오버레이 -->
      <div id="subtitle-overlay" class="hidden">
        <div id="subtitle-text"></div>
      </div>

      <!-- 전광판 홍보 영상 오버레이 (#9 선착장 bg_pier 위에 겹침) -->
      <div id="promo-billboard-overlay" class="hidden"></div>

      <!-- 채팅 목록 오버레이 (코드 제작 메신저 UI — #6, #7, #8) -->
      <div id="chat-list-overlay" class="hidden"></div>

      <!-- 휴대폰 메시지 화면 UI (채팅 말풍선 — 9:19.5 스마트폰 비율 고정) -->
      <div id="phone-message-overlay" class="hidden">
        <div class="phone-screen">
          <div class="phone-status-bar">
            <span>오후 6:20</span>
            <span>5G · 87%</span>
          </div>
          <div class="phone-header">
            <span class="phone-header-title" id="phone-partner-name">메시지</span>
            <button class="phone-close-btn" id="btn-close-phone">✕</button>
          </div>
          <div class="phone-messages" id="phone-messages-list"></div>
        </div>
      </div>

      <!-- 시간 표기 (우상단) -->
      <div id="time-label"></div>

      <!-- 호감도 게이지 (우상단) -->
      <div id="affinity-bar"></div>

      <!-- 상단 게임 메뉴바 (개별 이미지 버튼 6종, 접근성 레이블 및 텍스트 폴백 포함) -->
      <div id="game-menu-bar" role="toolbar" aria-label="게임 시스템 메뉴">
        <button type="button" class="menu-btn toolbar-img-btn theme-pink" id="btn-save" data-toolbar-key="save" aria-label="세이브">
          <img class="toolbar-btn-img" src="assets/ui/ui_btn_save.png" srcset="assets/ui/ui_btn_save.png 1x, assets/ui/ui_btn_save@2x.png 2x" width="361" height="121" alt="" draggable="false">
          <span class="visually-hidden">세이브</span>
          <span class="toolbar-btn-fallback" aria-hidden="true">세이브</span>
        </button>
        <button type="button" class="menu-btn toolbar-img-btn theme-lavender" id="btn-load" data-toolbar-key="load" aria-label="불러오기">
          <img class="toolbar-btn-img" src="assets/ui/ui_btn_load.png" srcset="assets/ui/ui_btn_load.png 1x, assets/ui/ui_btn_load@2x.png 2x" width="361" height="121" alt="" draggable="false">
          <span class="visually-hidden">불러오기</span>
          <span class="toolbar-btn-fallback" aria-hidden="true">불러오기</span>
        </button>
        <button type="button" class="menu-btn toolbar-img-btn theme-pink" id="btn-settings" data-toolbar-key="settings" aria-label="설정">
          <img class="toolbar-btn-img" src="assets/ui/ui_btn_settings.png" srcset="assets/ui/ui_btn_settings.png 1x, assets/ui/ui_btn_settings@2x.png 2x" width="361" height="121" alt="" draggable="false">
          <span class="visually-hidden">설정</span>
          <span class="toolbar-btn-fallback" aria-hidden="true">설정</span>
        </button>
        <button type="button" class="menu-btn toolbar-img-btn theme-lavender" id="btn-to-title" data-toolbar-key="title" aria-label="타이틀">
          <img class="toolbar-btn-img" src="assets/ui/ui_btn_title.png" srcset="assets/ui/ui_btn_title.png 1x, assets/ui/ui_btn_title@2x.png 2x" width="361" height="121" alt="" draggable="false">
          <span class="visually-hidden">타이틀</span>
          <span class="toolbar-btn-fallback" aria-hidden="true">타이틀</span>
        </button>
        <button type="button" class="menu-btn toolbar-img-btn theme-pink" id="btn-auto" data-toolbar-key="auto" aria-label="자동" aria-pressed="false">
          <img class="toolbar-btn-img" src="assets/ui/ui_btn_auto.png" srcset="assets/ui/ui_btn_auto.png 1x, assets/ui/ui_btn_auto@2x.png 2x" width="361" height="121" alt="" draggable="false">
          <span class="visually-hidden">자동</span>
          <span class="toolbar-btn-fallback" aria-hidden="true">자동</span>
          <span class="toolbar-on-badge" aria-hidden="true">ON</span>
        </button>
        <button type="button" class="menu-btn toolbar-img-btn theme-lavender" id="btn-skip" data-toolbar-key="skip" aria-label="스킵" aria-pressed="false">
          <img class="toolbar-btn-img" src="assets/ui/ui_btn_skip.png" srcset="assets/ui/ui_btn_skip.png 1x, assets/ui/ui_btn_skip@2x.png 2x" width="361" height="121" alt="" draggable="false">
          <span class="visually-hidden">스킵</span>
          <span class="toolbar-btn-fallback" aria-hidden="true">스킵</span>
          <span class="toolbar-on-badge" aria-hidden="true">ON</span>
        </button>
      </div>

      <!-- 챕터 타이틀 오버레이 -->
      <div id="chapter-title-overlay" class="hidden">
        <div id="chapter-title-text"></div>
      </div>

      <!-- 일반 장면 페이드 전환 오버레이 (TRANSITION_MODE='fade' 전용, 입력 비차단) -->
      <div id="scene-fade-overlay" class="hidden"></div>

      <!-- 대사창 -->
      <div id="dialogue-box">
        <div id="speaker-name"></div>
        <div id="dialogue-text"></div>
        <div id="dialogue-arrow">▼</div>
      </div>

      <!-- 선택지 컨테이너 -->
      <div id="choices-container" class="hidden"></div>

    </div><!-- /#game-wrapper -->
  </div><!-- /#screen-game -->

  <!-- ══════════════════════════════════════
       3. 성별 선택 모달
  ══════════════════════════════════════ -->
  <div id="modal-gender" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>성별 / 데이트 상대 선택</h2>
      </div>
      <p id="gender-prompt" class="modal-desc">만나고 싶은 인물들의 성별을 선택하세요.</p>
      <div class="gender-options">
        <button class="modal-btn choice-btn-large" id="btn-gender-female" data-gender="female">
          여성 등장인물과 데이트<br>
          <span class="sub-desc">(다곡희, 양연미, 고규미, 박복은)</span>
        </button>
        <button class="modal-btn choice-btn-large" id="btn-gender-male" data-gender="male">
          남성 등장인물과 데이트<br>
          <span class="sub-desc">(다고길, 양연우, 고구민, 박복검)</span>
        </button>
      </div>
      <div class="modal-actions" style="margin-top: 16px;">
        <button class="modal-btn secondary" id="btn-gender-back">뒤로</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════
       4. 이름 입력 모달
  ══════════════════════════════════════ -->
  <div id="modal-name" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>주인공 이름 입력</h2>
      </div>
      <p class="modal-desc">춘천으로 여행을 떠날 당신의 이름을 입력해 주세요. (1~8글자)</p>
      <div class="name-input-group">
        <input type="text" id="input-player-name" maxlength="8" placeholder="이름을 입력하세요" autocomplete="off">
        <div id="name-error-msg" class="error-msg hidden">공백 제외 1~8자로 입력해 주세요.</div>
      </div>
      <div class="modal-actions" style="display: flex; gap: 10px; margin-top: 16px;">
        <button class="modal-btn secondary" id="btn-name-back" style="flex: 1;">뒤로</button>
        <button class="modal-btn" id="btn-name-confirm" style="flex: 2;">여행 시작하기</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════
       5. 세이브/로드 모달
  ══════════════════════════════════════ -->
  <div id="modal-save" class="modal-overlay vn-save-overlay hidden">
    <div class="modal-content vn-save-modal-content">
      <div class="modal-header vn-save-header">
        <h2 id="modal-save-title">저장하기</h2>
        <button type="button" class="modal-close vn-save-close" id="btn-close-save" aria-label="닫기">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false">
            <path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div id="save-slots" class="vn-save-slots-list" role="listbox" aria-label="저장 슬롯 목록"></div>
    </div>
  </div>

  <!-- ══════════════════════════════════════
       6. 설정 모달
  ══════════════════════════════════════ -->
  <div id="modal-settings" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>설정</h2>
        <button class="modal-close" id="btn-close-settings">✕</button>
      </div>
      <div class="settings-body">
        <div class="settings-row">
          <label for="slider-text-speed">글자 속도</label>
          <input type="range" id="slider-text-speed" min="10" max="150" step="10" value="40">
          <span id="label-text-speed">40ms</span>
        </div>
        <div class="settings-row">
          <label for="slider-bgm">BGM 볼륨</label>
          <input type="range" id="slider-bgm" min="0" max="1" step="0.05" value="0.5">
          <span id="label-bgm">50%</span>
        </div>
        <div class="settings-row">
          <label for="slider-sfx">효과음 볼륨</label>
          <input type="range" id="slider-sfx" min="0" max="1" step="0.05" value="0.7">
          <span id="label-sfx">70%</span>
        </div>
        <div class="settings-row">
          <label for="toggle-affinity">호감도 팝업/게이지 표시</label>
          <input type="checkbox" id="toggle-affinity" checked>
        </div>
        <div class="settings-actions">
          <button class="modal-btn" id="btn-settings-save">저장</button>
          <button class="modal-btn secondary" id="btn-settings-cancel">닫기</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════
       7. 기록실 모달
  ══════════════════════════════════════ -->
  <div id="modal-gallery" class="modal-overlay hidden">
    <div class="modal-content modal-gallery-content">
      <div class="modal-header">
        <h2>기록실 — 엔딩 컬렉션</h2>
        <button class="modal-close" id="btn-close-gallery">✕</button>
      </div>
      <div id="gallery-grid"></div>
    </div>
  </div>

  <!-- 저장 완료/실패 토스트 팝업 (입력 비차단) -->
  <div id="save-toast" class="hidden" role="status" aria-live="polite"></div>

  <!-- ══════════════════════════════════════
       8. 개발자 디버그 패널 (D 키로 토글)
  ══════════════════════════════════════ -->
  <div id="debug-panel">
    <div id="debug-content">
      <div style="font-weight:bold;color:#f1c40f;">[ 개발자 디버그 패널 (D키) ]</div>
      <div id="debug-stats"></div>
      <div style="margin-top:8px;">
        <label for="debug-scene-select" style="font-size:0.8em;color:#aaa;">장면 점프:</label>
        <select id="debug-scene-select" style="width:100%;font-size:0.8em;padding:2px;"></select>
        <button id="btn-debug-jump" style="width:100%;margin-top:4px;font-size:0.8em;cursor:pointer;">해당 장면으로 이동</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/save.js"></script>
  <script src="js/like_gauge.js"></script>
  <script src="js/confirm_popup.js"></script>
  <script src="js/save_modal.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
